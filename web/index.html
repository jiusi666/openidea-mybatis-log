<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyBatis Log</title>
<style>
  :root {
    --bg: #ffffff; --solid: #ffffff; --soft: #f6f8fa; --code: #f7f8fa;
    --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-fg: #ffffff;
    --kw: #0550ae; --str: #0a7d38; --num: #b35900;
    --warn: #9a6700; --warn-bg: #fff8e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f; --solid: #2b2b2b; --soft: #292929; --code: #242424;
      --fg: #e6e6e6; --muted: #9aa0a6; --line: #3a3a3a;
      --accent: #4c8dff; --accent-fg: #0b1220;
      --kw: #79c0ff; --str: #7ee787; --num: #ffa657;
      --warn: #e3b341; --warn-bg: #3a2f14;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; }
  button, select, input { font: inherit; color: var(--fg); background: var(--solid);
    border: 1px solid var(--line); border-radius: 6px; }
  button { cursor: pointer; white-space: nowrap; padding: 5px 10px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.mini { padding: 2px 8px; font-size: 11px; }
  select { padding: 4px 6px; font-size: 12px; }
  header { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .badge { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #status { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .toolbar { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .row.wrap { flex-wrap: wrap; }
  .segmented { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 2px;
    padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .segmented button { border: 0; border-radius: 5px; background: transparent;
    color: var(--muted); padding: 3px 9px; font-size: 12px; }
  .segmented button.on { background: var(--soft); color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
    color: var(--muted); white-space: nowrap; cursor: pointer; }
  .chk input { margin: 0; accent-color: var(--accent); }
  .lbl { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #filterText { flex: 1 1 90px; min-width: 70px; padding: 4px 7px; font-size: 12px; }
  .editor { flex: 0 0 auto; padding: 9px 12px 10px; border-bottom: 1px solid var(--line); }
  .editor .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .editor .head b { font-size: 12px; font-weight: 600; }
  .editor .head span { font-size: 11px; color: var(--muted); }
  textarea { display: block; width: 100%; height: 118px; resize: vertical; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--code); color: var(--fg);
    font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, "Microsoft YaHei", monospace;
    white-space: pre-wrap; word-break: break-word; overflow-x: hidden; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea::-webkit-scrollbar { width: 8px; }
  textarea::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  textarea::-webkit-scrollbar-track { background: transparent; }
  .results { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .results::-webkit-scrollbar { width: 8px; height: 8px; }
  .results::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .results::-webkit-scrollbar-track { background: transparent; }
  .notes { margin: 10px 12px 0; padding: 8px 10px; background: var(--soft);
    border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; }
  .empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.9; }
  .empty b { color: var(--fg); }
  .card { margin: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--solid); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: var(--soft); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .idx { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: .3px; }
  .tag.kind-update, .tag.kind-delete, .tag.kind-drop, .tag.kind-truncate,
  .tag.kind-alter { color: var(--warn); }
  .meta { font-size: 11px; color: var(--muted); background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
    white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .meta.num { color: var(--accent); font-variant-numeric: tabular-nums; }
  pre.sql { margin: 0; padding: 10px 12px; background: var(--code);
    white-space: pre-wrap; word-break: break-word;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, "Microsoft YaHei", monospace; }
  .sql .k { color: var(--kw); font-weight: 600; }
  .sql .s { color: var(--str); }
  .sql .n { color: var(--num); }
  .sql .c { color: var(--muted); font-style: italic; }
  .params { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px;
    border-top: 1px solid var(--line); }
  .chip { font: 11px/1.4 ui-monospace, Consolas, monospace; padding: 2px 6px;
    background: var(--soft); border: 1px solid var(--line); border-radius: 4px; }
  .chip i { color: var(--muted); font-style: normal; }
  .ptable { width: 100%; border-collapse: collapse; border-top: 1px solid var(--line);
    font: 11px/1.5 ui-monospace, Consolas, monospace; table-layout: fixed; }
  .ptable th { text-align: left; font-weight: 500; color: var(--muted);
    background: var(--soft); padding: 5px 8px; border-bottom: 1px solid var(--line); }
  .ptable td { padding: 4px 8px; border-bottom: 1px solid var(--line); word-break: break-all; }
  .ptable tr:last-child td { border-bottom: 0; }
  .ptable th:first-child, .ptable td:first-child { width: 34px; }
  .ptable th:nth-child(3), .ptable td:nth-child(3) { width: 28%; }
  .warn { padding: 7px 12px; border-top: 1px solid var(--line);
    background: var(--warn-bg); color: var(--warn); font-size: 12px; }
  .warn.risk { font-weight: 600; }
  .history { display: flex; align-items: center; gap: 7px; padding: 8px 12px;
    border-top: 1px solid var(--line); }
  #history { flex: 1 1 auto; min-width: 0; }
  footer { padding: 6px 12px 8px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px;
    font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<header>
  <h1>MyBatis Log</h1>
  <span class="badge" id="source">等待输入</span>
  <span id="status">0 条 SQL</span>
</header>

<div class="toolbar">
  <div class="row">
    <button class="primary" id="restore">还原 SQL</button>
    <button id="copyAll">复制全部</button>
    <button id="clear">清空</button>
    <span class="grow"></span>
    <div class="segmented">
      <button id="prettyOn" class="seg on">美化</button>
      <button id="prettyOff" class="seg">单行</button>
    </div>
  </div>
  <div class="row">
    <span class="lbl">引号</span>
    <select id="quote"><option value="single">单引号 '</option><option value="double">双引号 "</option></select>
    <span class="lbl">空值</span>
    <select id="nullLit"><option value="NULL">NULL</option><option value="null">null</option></select>
    <label class="chk"><input type="checkbox" id="upper">关键字大写</label>
    <label class="chk"><input type="checkbox" id="semi">补分号</label>
  </div>
  <div class="row wrap">
    <span class="lbl">筛选</span>
    <select id="filterKind">
      <option value="ALL">全部类型</option>
      <option value="SELECT">SELECT</option>
      <option value="INSERT">INSERT</option>
      <option value="UPDATE">UPDATE</option>
      <option value="DELETE">DELETE</option>
      <option value="SQL">其它</option>
    </select>
    <input id="filterText" type="text" placeholder="SQL / logger 关键字" spellcheck="false">
    <label class="chk"><input type="checkbox" id="onlyRisk">只看风险</label>
    <span class="grow"></span>
    <label class="chk"><input type="checkbox" id="showParamTable" checked>参数表</label>
    <label class="chk"><input type="checkbox" id="riskHints" checked>风险提示</label>
  </div>
</div>

<div class="editor">
  <div class="head"><b>控制台日志</b><span>粘贴自动还原 · Ctrl/⌘+Enter 存历史 · Alt+Shift+M 取选中文本</span></div>
  <textarea id="input" spellcheck="false" placeholder="==&gt;  Preparing: select * from user where id = ?&#10;==&gt; Parameters: 1001(Long)"></textarea>
</div>

<div class="results" id="results"></div>

<div class="history" title="停止输入约 1 秒自动记一条；连续修改只保留最后一条。点「还原 SQL」或 Ctrl/⌘+Enter 立即保存一条">
  <span class="lbl">历史</span>
  <select id="history"><option value="">最近的输入（停止输入自动保存）…</option></select>
  <button class="mini" id="loadHistory">载入</button>
  <button class="mini" id="delHistory">删除</button>
</div>

<footer>纯本机文本处理 · 只读当前编辑器文本 · 不联网、不改文件、不读写系统剪贴板</footer>
<div class="toast" id="toast"></div>

<script>
(function () {
  var hasHost = !!(window.openidea && window.openidea.postMessage);
  function $(id) { return document.getElementById(id); }
  var inputEl = $('input'), resultsEl = $('results'), toastEl = $('toast');
  var filterKind = $('filterKind'), filterText = $('filterText'), onlyRisk = $('onlyRisk');
  var last = null, timer = null, stableTimer = null;

  var KW = { select:1, from:1, where:1, and:1, or:1, not:1, null:1, is:1, in:1, like:1,
    between:1, order:1, by:1, group:1, having:1, limit:1, offset:1, insert:1, into:1,
    values:1, update:1, set:1, delete:1, join:1, left:1, right:1, inner:1, cross:1,
    on:1, union:1, all:1, distinct:1, as:1, case:1, when:1, then:1, else:1, end:1,
    asc:1, desc:1, count:1, sum:1, avg:1, min:1, max:1, exists:1, with:1 };
  var TOKEN = /(--[^\n]*|\/\*[\s\S]*?\*\/|'(?:[^']|'')*'|"(?:[^"]|"")*"|[A-Za-z_][A-Za-z0-9_$]*|\d+(?:\.\d+)?)/g;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function highlight(sql) {
    var out = '', pos = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(sql)) !== null) {
      out += esc(sql.slice(pos, m.index));
      var t = m[0], cls = '';
      if (t.slice(0, 2) === '--' || t.slice(0, 2) === '/*') cls = 'c';
      else if (t.charAt(0) === "'" || t.charAt(0) === '"') cls = 's';
      else if (/^\d/.test(t)) cls = 'n';
      else if (KW[t.toLowerCase()]) cls = 'k';
      out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
      pos = TOKEN.lastIndex;
    }
    return out + esc(sql.slice(pos));
  }

  var PALETTE = ['#2563eb', '#0f766e', '#b45309', '#7c3aed', '#be185d', '#4d7c0f'];
  function loggerColor(name) {
    if (!name) return 'transparent';
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function matches(r) {
    var k = filterKind.value;
    if (k !== 'ALL' && (r.kind || 'SQL') !== k) return false;
    if (k === 'SQL' && r.kind && r.kind !== 'SQL') return false;
    var q = (filterText.value || '').trim().toLowerCase();
    if (q && (r.sql || '').toLowerCase().indexOf(q) < 0
      && (r.logger || '').toLowerCase().indexOf(q) < 0) return false;
    if (onlyRisk.checked && !(r.risks && r.risks.length)) return false;
    return true;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.className = 'toast'; }, 1800);
  }

  // 停止输入一会儿后自动记一条历史；host 会把连续的自动记录合并成一条，不刷屏。
  function scheduleStable(text) {
    clearTimeout(stableTimer);
    stableTimer = setTimeout(function () {
      send({ type: 'restore', text: text, remember: true, auto: true });
    }, 1200);
  }

  function send(obj) {
    if (hasHost) window.openidea.postMessage(JSON.stringify(obj));
    else localHandle(obj);
  }

  function render(s) {
    last = s;
    var o = s.options || {}, d = s.display || {};
    // 重绘不能打断用户正在输入的内容。
    if (document.activeElement !== inputEl) inputEl.value = s.input || '';
    $('prettyOn').className = 'seg' + (o.pretty ? ' on' : '');
    $('prettyOff').className = 'seg' + (o.pretty ? '' : ' on');
    $('quote').value = o.quote === 'double' ? 'double' : 'single';
    $('nullLit').value = o.nullLiteral === 'null' ? 'null' : 'NULL';
    $('upper').checked = !!o.uppercaseKeywords;
    $('semi').checked = !!o.semicolon;
    $('showParamTable').checked = d.showParamTable !== false;
    $('riskHints').checked = d.riskHints !== false;

    var rs = s.results || [], shown = [];
    rs.forEach(function (r, i) { if (matches(r)) shown.push({ r: r, i: i }); });
    $('status').textContent = shown.length === rs.length
      ? rs.length + ' 条 SQL'
      : shown.length + ' / ' + rs.length + ' 条 SQL';
    $('source').textContent = s.source ? '来自' + s.source : '等待输入';

    var sel = $('history'), keep = sel.value;
    var h = '<option value="">最近的输入（停止输入自动保存）…</option>';
    (s.history || []).forEach(function (item, i) {
      h += '<option value="' + i + '">' + esc(item.label || ('记录 ' + (i + 1))) + '</option>';
    });
    sel.innerHTML = h;
    if (keep !== '') sel.value = keep;

    var html = '';
    (s.notes || []).forEach(function (n) { html += '<div class="notes">' + esc(n) + '</div>'; });
    if (!shown.length && !(s.notes || []).length) {
      html += '<div class="empty">' + (rs.length
        ? '当前筛选下没有匹配的 SQL，换个类型或清空关键字试试'
        : '粘贴含 <b>Preparing</b> / <b>Parameters</b> 的 MyBatis 日志，<br>'
          + '或选中日志后按 <b>Alt+Shift+M</b>（macOS <b>⌘⇧M</b>）<br>一次可还原多条 SQL，结果可直接复制执行') + '</div>';
    }
    shown.forEach(function (it) {
      var r = it.r, i = it.i;
      var text = o.pretty ? (r.pretty || r.sql) : r.sql;
      var kind = r.kind || 'SQL';
      var meta = '';
      if (r.logger) meta += '<span class="meta" title="' + esc(r.logger) + '">' + esc(r.logger) + '</span>';
      if (r.elapsedMs != null) meta += '<span class="meta num">' + r.elapsedMs + ' ms</span>';
      if (r.rows != null) meta += '<span class="meta num">'
        + (kind === 'SELECT' ? '返回 ' : '影响 ') + r.rows + ' 行</span>';
      if (r.dialect && r.dialect !== 'mybatis') meta += '<span class="meta">' + esc(r.dialect) + '</span>';
      html += '<div class="card" style="border-left:3px solid ' + loggerColor(r.logger || '') + '">'
        + '<div class="card-head"><span class="idx">#' + (i + 1) + '</span>'
        + '<span class="tag kind-' + kind.toLowerCase() + '">' + esc(kind) + '</span>' + meta
        + '<span class="grow"></span><button class="mini" data-copy="' + i + '">复制</button></div>'
        + '<pre class="sql">' + highlight(text || '') + '</pre>';

      var showTable = $('showParamTable').checked;
      if (r.paramRows && r.paramRows.length && showTable) {
        html += '<table class="ptable"><thead><tr><th>#</th><th>原始值</th>'
          + '<th>Java 类型</th><th>回填结果</th></tr></thead><tbody>';
        r.paramRows.forEach(function (p) {
          html += '<tr><td>' + p.index + '</td><td>' + esc(p.raw) + '</td><td>'
            + esc(p.javaType || '—') + '</td><td>' + esc(p.rendered) + '</td></tr>';
        });
        html += '</tbody></table>';
      } else if (r.params && r.params.length) {
        html += '<div class="params">';
        r.params.forEach(function (p, j) {
          var ty = (r.types && r.types[j]) ? ' <i>' + esc(r.types[j]) + '</i>' : '';
          html += '<span class="chip">?' + (j + 1) + ' → ' + esc(p) + ty + '</span>';
        });
        html += '</div>';
      }
      (r.warnings || []).forEach(function (w) {
        html += '<div class="warn">注意：' + esc(w) + '</div>';
      });
      if ($('riskHints').checked) (r.risks || []).forEach(function (w) {
        html += '<div class="warn risk">提示：' + esc(w) + '</div>';
      });
      html += '</div>';
    });
    resultsEl.innerHTML = html;
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? '已复制 SQL' : '复制受限，请选中结果后按 Ctrl+C');
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { toast('已复制 SQL'); },
        function () { fallbackCopy(text); }
      );
    } else {
      fallbackCopy(text);
    }
  }

  $('restore').addEventListener('click', function () {
    clearTimeout(timer); clearTimeout(stableTimer);
    send({ type: 'restore', text: inputEl.value, remember: true });
  });
  $('clear').addEventListener('click', function () {
    clearTimeout(timer); clearTimeout(stableTimer);
    inputEl.value = '';
    send({ type: 'clear' });
  });
  $('copyAll').addEventListener('click', function () {
    var rs = (last && last.results) || [];
    var shown = rs.filter(matches);
    if (!shown.length) { toast('当前筛选下没有可复制的 SQL'); return; }
    copy(shown.map(function (r) { return r.sql; }).join('\n\n'));
  });
  resultsEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-copy]') : null;
    if (!b || !last || !last.results) return;
    var i = parseInt(b.getAttribute('data-copy'), 10);
    if (last.results[i]) copy(last.results[i].sql);
  });
  inputEl.addEventListener('input', function () {
    clearTimeout(timer); clearTimeout(stableTimer);
    var text = inputEl.value;
    timer = setTimeout(function () {
      send({ type: 'restore', text: text, remember: false });
    }, 350);
    scheduleStable(text);
  });
  inputEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      clearTimeout(timer); clearTimeout(stableTimer);
      send({ type: 'restore', text: inputEl.value, remember: true });
    }
  });
  $('prettyOn').addEventListener('click', function () { send({ type: 'setOption', key: 'pretty', value: true }); });
  $('prettyOff').addEventListener('click', function () { send({ type: 'setOption', key: 'pretty', value: false }); });
  $('quote').addEventListener('change', function () { send({ type: 'setOption', key: 'quote', value: $('quote').value }); });
  $('nullLit').addEventListener('change', function () { send({ type: 'setOption', key: 'nullLiteral', value: $('nullLit').value }); });
  $('upper').addEventListener('change', function () { send({ type: 'setOption', key: 'uppercaseKeywords', value: $('upper').checked }); });
  $('semi').addEventListener('change', function () { send({ type: 'setOption', key: 'semicolon', value: $('semi').checked }); });
  $('showParamTable').addEventListener('change', function () {
    send({ type: 'setOption', key: 'showParamTable', value: $('showParamTable').checked });
  });
  $('riskHints').addEventListener('change', function () {
    send({ type: 'setOption', key: 'riskHints', value: $('riskHints').checked });
  });
  filterKind.addEventListener('change', function () { if (last) render(last); });
  filterText.addEventListener('input', function () { if (last) render(last); });
  onlyRisk.addEventListener('change', function () { if (last) render(last); });
  $('loadHistory').addEventListener('click', function () {
    var v = $('history').value;
    if (v !== '') send({ type: 'history', index: parseInt(v, 10) });
  });
  $('delHistory').addEventListener('click', function () {
    var v = $('history').value;
    if (v !== '') { $('history').value = ''; send({ type: 'deleteHistory', index: parseInt(v, 10) }); }
  });

  var DEMO = "2026-11-13 10:00:00.123 DEBUG --- [main] c.e.mapper.UserMapper.selectById : ==>  Preparing: select id, name, status from user where id = ? and status = ?\n"
    + "==> Parameters: 1001(Long), ACTIVE(String)\n<==      Total: 1\nTime: 12 ms";
  function localHandle(obj) {
